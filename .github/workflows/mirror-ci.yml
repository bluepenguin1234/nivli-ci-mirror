# Mirror-only workflow: compiles the app and both extensions on a GitHub-hosted Mac and
# runs the unit tests. Lives only on the temporary public mirror.
name: Mirror CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/preflight.py
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || true
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available | grep -i iphone | head -5
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned, simulator)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Nivli.xcodeproj -scheme Nivli \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build/build.log
      - name: Unit tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [d for key, devices in data["devices"].items() if "iOS" in key
                    for d in devices if d["name"].startswith("iPhone") and d.get("isAvailable")]
          phones.sort(key=lambda d: d["name"])
          print(phones[-1]["udid"] if phones else "")')
          echo "Simulator: $DEVICE_ID"
          xcodebuild test \
            -project Nivli.xcodeproj -scheme Nivli \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:NivliTests \
            -resultBundlePath build/Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/unit.log | grep -E "error:|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" build/unit.log
      - name: UI smoke test
        if: success()
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [d for key, devices in data["devices"].items() if "iOS" in key
                    for d in devices if d["name"].startswith("iPhone") and d.get("isAvailable")]
          phones.sort(key=lambda d: d["name"])
          print(phones[-1]["udid"] if phones else "")')
          xcodebuild test \
            -project Nivli.xcodeproj -scheme Nivli \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:NivliUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/ui.log | grep -E "error:|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" build/ui.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: build/*.log
          if-no-files-found: ignore
